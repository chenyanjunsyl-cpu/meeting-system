<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>编辑预约</title>
    <style>
        :root { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; color: #111827; background: #eef2ff; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, rgba(37,99,235,0.14), transparent 30%), #eef2ff; }
        .container { width: min(780px, calc(100vw - 32px)); margin: 40px auto; padding: 28px; background: #ffffff; border: 1px solid rgba(148,163,184,0.18); border-radius: 24px; box-shadow: 0 24px 50px rgba(15,23,42,0.08); }
        h1 { margin: 0 0 22px; font-size: 2rem; }
        .form-row { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #475569; font-size: 0.95rem; }
        input, select { width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 14px; background: #f8fafc; color: #0f172a; }
        input:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,0.12); }
        .button { padding: 14px 20px; border-radius: 14px; border: none; background: #2563eb; color: #fff; cursor: pointer; transition: transform 0.18s ease, background 0.18s ease; }
        .button:hover { background: #1d4ed8; transform: translateY(-1px); }
        .button.cancel { background: #6b7280; }
        .button.cancel:hover { background: #4b5563; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
        .attendee-picker { position: relative; }
        .attendee-menu { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); max-height: 260px; overflow-y: auto; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 14px; box-shadow: 0 18px 38px rgba(15,23,42,0.16); padding: 6px; display: none; }
        .attendee-menu.open { display: block; }
        .attendee-option { width: 100%; display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent; color: #0f172a; text-align: left; cursor: pointer; }
        .attendee-option:hover, .attendee-option.active { background: #eff6ff; }
        .attendee-option.selected { color: #64748b; cursor: default; background: #f8fafc; }
        .attendee-name { font-weight: 700; line-height: 1.35; }
        .attendee-meta { color: #64748b; font-size: 0.82rem; line-height: 1.35; margin-top: 2px; overflow-wrap: anywhere; }
        .attendee-badge { flex: 0 0 auto; border-radius: 999px; padding: 3px 8px; background: #dbeafe; color: #1d4ed8; font-size: 0.78rem; font-weight: 700; }
        .attendee-empty { padding: 12px; color: #64748b; font-size: 0.9rem; }
        .time-wheel { position: relative; }
        .time-wheel-input { cursor: pointer; }
        .time-wheel-panel { position: absolute; z-index: 30; left: 0; top: calc(100% + 6px); width: min(280px, 100%); height: 248px; display: none; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 14px; background: #ffffff; box-shadow: 0 18px 38px rgba(15,23,42,0.16); }
        .time-wheel-panel.open { display: grid; }
        .time-wheel-column { overflow-y: auto; border-radius: 10px; background: #f8fafc; scrollbar-width: thin; }
        .time-wheel-option { width: 100%; height: 38px; border: 0; background: transparent; color: #0f172a; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .time-wheel-option:hover { background: #e0f2fe; }
        .time-wheel-option.active { background: #dbeafe; color: #0f172a; outline: 1px solid #2563eb; }
    </style>
</head>
<body>
<div class="container">
    <h1>编辑预约</h1>
    <form method="post" action="/admin/bookings/update/{{ booking.booking_id }}">
        <div class="form-row">
            <label for="room_id">选择会议室</label>
            <select id="room_id" name="room_id" required>
                {% for room in rooms %}
                    <option value="{{ room.room_id }}" {% if room.room_id == booking.room_id %}selected{% endif %}>{{ room.name }}（{{ room.location }} / {{ room.capacity }}人）</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <label for="date">会议日期</label>
            <input type="date" id="date" name="date" value="{{ booking.date }}" required>
        </div>
        <div class="form-row">
            <label for="start_time">开始时间</label>
            <div class="time-wheel" data-time-wheel>
                <input type="text" id="start_time" name="start_time" class="time-wheel-input" value="{{ booking.start_time }}" autocomplete="off" inputmode="none" readonly required data-time-input>
                <div class="time-wheel-panel" data-time-panel>
                    <div class="time-wheel-column" data-hour-list></div>
                    <div class="time-wheel-column" data-minute-list></div>
                </div>
            </div>
        </div>
        <div class="form-row">
            <label for="end_time">结束时间</label>
            <div class="time-wheel" data-time-wheel>
                <input type="text" id="end_time" name="end_time" class="time-wheel-input" value="{{ booking.end_time }}" autocomplete="off" inputmode="none" readonly required data-time-input>
                <div class="time-wheel-panel" data-time-panel>
                    <div class="time-wheel-column" data-hour-list></div>
                    <div class="time-wheel-column" data-minute-list></div>
                </div>
            </div>
        </div>
        <div class="form-row">
            <label for="subject">会议主题</label>
            <input type="text" id="subject" name="subject" value="{{ booking.subject }}" required>
        </div>
        <div class="form-row">
            <label for="owner">申请人</label>
            <input type="text" id="owner" name="owner" value="{{ booking.owner }}" required>
        </div>
        <div class="form-row">
            <label for="attendees">参会人员</label>
            <div class="attendee-picker">
                <input type="text" id="attendees" name="attendees" value="{{ booking.attendees }}" autocomplete="off" data-ad-picker="true" required>
                <div class="attendee-menu" id="attendees-menu"></div>
            </div>
        </div>
        <div class="actions">
            <button type="submit" class="button">保存修改</button>
            <a href="/" class="button cancel">返回首页</a>
        </div>
    </form>
</div>
<script>
(function () {
    const hours = Array.from({ length: 24 }, (_, index) => String(index).padStart(2, '0'));
    const minutes = ['00', '10', '20', '30', '40', '50'];

    function fallbackTime() {
        const now = new Date();
        const hour = String(now.getHours()).padStart(2, '0');
        const minute = String(Math.floor(now.getMinutes() / 10) * 10).padStart(2, '0');
        return { hour, minute };
    }

    function parseTime(value) {
        const match = /^(\d{2}):(\d{2})$/.exec(value || '');
        if (match && hours.includes(match[1]) && minutes.includes(match[2])) {
            return { hour: match[1], minute: match[2] };
        }
        return fallbackTime();
    }

    function renderColumn(column, values, selected, onChoose) {
        column.innerHTML = values.map(value => `
            <button type="button" class="time-wheel-option${value === selected ? ' active' : ''}" data-value="${value}">
                ${value}
            </button>
        `).join('');
        column.querySelectorAll('.time-wheel-option').forEach(button => {
            button.addEventListener('mousedown', event => {
                event.preventDefault();
                onChoose(button.dataset.value);
            });
        });
        const active = column.querySelector('.time-wheel-option.active');
        if (active) {
            active.scrollIntoView({ block: 'center' });
        }
    }

    document.querySelectorAll('[data-time-wheel]').forEach(wheel => {
        const input = wheel.querySelector('[data-time-input]');
        const panel = wheel.querySelector('[data-time-panel]');
        const hourList = wheel.querySelector('[data-hour-list]');
        const minuteList = wheel.querySelector('[data-minute-list]');
        let selected = parseTime(input.value);

        function setValue() {
            input.value = `${selected.hour}:${selected.minute}`;
            input.dispatchEvent(new Event('change', { bubbles: true }));
        }

        function render() {
            renderColumn(hourList, hours, selected.hour, value => {
                selected.hour = value;
                setValue();
                render();
            });
            renderColumn(minuteList, minutes, selected.minute, value => {
                selected.minute = value;
                setValue();
                render();
            });
        }

        input.addEventListener('click', () => {
            selected = parseTime(input.value);
            render();
            panel.classList.add('open');
        });

        input.addEventListener('keydown', event => {
            if (event.key === 'Escape') panel.classList.remove('open');
        });
    });

    document.addEventListener('click', event => {
        document.querySelectorAll('[data-time-panel].open').forEach(panel => {
            if (!panel.closest('[data-time-wheel]').contains(event.target)) {
                panel.classList.remove('open');
            }
        });
    });
})();

(function () {
    const input = document.querySelector('[data-ad-picker="true"]');
    const menu = document.getElementById('attendees-menu');
    if (!input || !menu) return;

    let timer = null;
    let users = [];
    let activeIndex = -1;
    let requestId = 0;

    function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
    }

    function splitPeople(value) {
        return value.split(/[，,]/).map(item => item.trim()).filter(Boolean);
    }

    function selectedKeys() {
        const keys = new Set();
        splitPeople(input.value).forEach(item => {
            keys.add(item.toLowerCase());
            const match = item.match(/\(([^)]+)\)\s*$|（([^）]+)）\s*$/);
            const username = match ? (match[1] || match[2] || '').trim() : '';
            if (username) keys.add(username.toLowerCase());
        });
        return keys;
    }

    function currentTerm() {
        const parts = input.value.split(/[，,]/);
        return (parts[parts.length - 1] || '').trim();
    }

    function isSelected(user) {
        const keys = selectedKeys();
        return keys.has((user.username || '').toLowerCase())
            || keys.has((user.display_name || '').toLowerCase())
            || keys.has((user.label || '').toLowerCase());
    }

    function replaceCurrentTerm(label) {
        const value = input.value;
        const lastComma = Math.max(value.lastIndexOf(','), value.lastIndexOf('，'));
        const prefix = lastComma >= 0 ? value.slice(0, lastComma + 1).trimEnd() + ' ' : '';
        input.value = prefix + label + ', ';
        input.focus();
        hideMenu();
        clearTimeout(timer);
        timer = setTimeout(searchUsers, 120);
    }

    function hideMenu() {
        menu.classList.remove('open');
        menu.innerHTML = '';
        activeIndex = -1;
    }

    function renderMenu() {
        if (!users.length) {
            menu.innerHTML = '<div class="attendee-empty">未找到匹配的 AD 用户</div>';
            menu.classList.add('open');
            return;
        }

        menu.innerHTML = users.map((user, index) => {
            const selected = isSelected(user);
            const badge = selected ? '<span class="attendee-badge">已选</span>' : '<span class="attendee-badge">选择</span>';
            const username = user.username ? `<div class="attendee-meta">${escapeHtml(user.username)}</div>` : '';
            const email = user.email ? `<div class="attendee-meta">${escapeHtml(user.email)}</div>` : '';
            return `
                <button type="button" class="attendee-option${selected ? ' selected' : ''}${index === activeIndex ? ' active' : ''}" data-index="${index}" ${selected ? 'aria-disabled="true"' : ''}>
                    <span>
                        <span class="attendee-name">${escapeHtml(user.display_name || user.label || user.username)}</span>
                        ${username}
                        ${email}
                    </span>
                    ${badge}
                </button>
            `;
        }).join('');
        menu.classList.add('open');
    }

    async function searchUsers() {
        const term = currentTerm();
        const id = ++requestId;
        try {
            const response = await fetch(`/api/ad/users?q=${encodeURIComponent(term)}`);
            if (id !== requestId) return;
            const data = await response.json();
            users = data.users || [];
            activeIndex = users.findIndex(user => !isSelected(user));
            renderMenu();
        } catch (error) {
            if (id === requestId) {
                users = [];
                menu.innerHTML = '<div class="attendee-empty">AD 用户列表暂时不可用</div>';
                menu.classList.add('open');
            }
        }
    }

    input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(searchUsers, 220);
    });

    input.addEventListener('focus', () => {
        clearTimeout(timer);
        timer = setTimeout(searchUsers, 120);
    });

    input.addEventListener('keydown', event => {
        if (!menu.classList.contains('open')) return;
        if (!users.length) return;
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault();
            const direction = event.key === 'ArrowDown' ? 1 : -1;
            let next = activeIndex;
            for (let i = 0; i < users.length; i += 1) {
                next = (next + direction + users.length) % users.length;
                if (!isSelected(users[next])) break;
            }
            activeIndex = next;
            renderMenu();
        }
        if (event.key === 'Enter' && activeIndex >= 0 && users[activeIndex] && !isSelected(users[activeIndex])) {
            event.preventDefault();
            replaceCurrentTerm(users[activeIndex].label);
        }
        if (event.key === 'Escape') {
            hideMenu();
        }
    });

    menu.addEventListener('mousedown', event => {
        const option = event.target.closest('.attendee-option');
        if (!option) return;
        event.preventDefault();
        const user = users[Number(option.dataset.index)];
        if (user && !isSelected(user)) {
            replaceCurrentTerm(user.label);
        }
    });

    document.addEventListener('click', event => {
        if (!event.target.closest('.attendee-picker')) hideMenu();
    });
})();
</script>
</body>
</html>
